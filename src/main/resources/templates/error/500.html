<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>500 · 服务器错误</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0a0f; --surface: #12121a; --border: #1e1e2e;
            --text: #e2e8f0; --muted: #64748b;
            --accent: #f59e0b; --accent2: #fbbf24;
        }
        body {
            background: var(--bg); color: var(--text);
            font-family: 'Space Grotesk', system-ui, sans-serif;
            min-height: 100vh; display: flex; align-items: center;
            justify-content: center; overflow: hidden; position: relative;
        }
        body::before {
            content: ''; position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(245,158,11,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(245,158,11,0.04) 1px, transparent 1px);
            background-size: 40px 40px; pointer-events: none;
        }
        body::after {
            content: ''; position: fixed; top: 20%; left: 50%;
            transform: translateX(-50%); width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(245,158,11,0.1) 0%, transparent 70%);
            pointer-events: none;
        }
        .container { position: relative; z-index: 1; text-align: center; padding: 2rem; max-width: 600px; }
        .error-code {
            font-size: clamp(7rem, 20vw, 12rem); font-weight: 700;
            line-height: 1; letter-spacing: -0.04em;
            background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 50%, #fde68a 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; user-select: none;
        }
        .emoji { font-size: 4rem; display: inline-block; margin: 1.5rem 0;
            animation: pulse 2s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(245,158,11,0.5)); }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        .title { font-size: 1.75rem; font-weight: 600; color: var(--text); margin-bottom: 0.75rem; letter-spacing: -0.02em; }
        .subtitle { font-size: 1rem; color: var(--muted); line-height: 1.7; margin-bottom: 2.5rem; }
        .actions { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
        .btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.75rem;
            border-radius: 10px; font-size: 0.95rem; font-weight: 500; font-family: inherit;
            text-decoration: none; cursor: pointer; border: none; transition: all 0.2s ease; }
        .btn-primary { background: linear-gradient(135deg, #f59e0b, #fbbf24); color: #1f2937;
            box-shadow: 0 4px 20px rgba(245,158,11,0.35); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(245,158,11,0.5); }
        .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--border); transform: translateY(-2px); }
        .error-detail { margin-top: 2rem; padding: 1rem 1.5rem; background: var(--surface);
            border: 1px solid var(--border); border-radius: 8px; font-size: 0.85rem;
            color: var(--muted); font-family: monospace; text-align: left;
            max-width: 500px; margin-left: auto; margin-right: auto; word-break: break-all; }
    </style>
</head>
<body>
<div class="container">
    <div class="error-code">500</div>
    <div class="emoji">⚙️</div>
    <h1 class="title">服务器开小差了</h1>
    <p class="subtitle">
        服务器遇到了一个意外错误，<br>
        工程师已经收到通知，正在紧急修复中。
    </p>
    <div class="actions">
        <a href="/dashboard" class="btn btn-primary">🏠 返回仪表板</a>
        <button onclick="location.reload()" class="btn btn-secondary">↻ 刷新页面</button>
    </div>
    <div class="error-detail" th:if="${message}" th:text="${message}"></div>
</div>
</body>
</html>
