<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>商品管理 | 后台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&amp;family=DM+Sans:wght@300;400;500&amp;display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link th:href="@{/css/main.css}" rel="stylesheet"/>
</head>
<body class="admin-body">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="admin-layout">
    <aside class="admin-sidebar">
        <div class="sidebar-header">
            <span class="brand-mark">AN</span><span class="brand-text">01</span>
        </div>
        <nav class="sidebar-nav">
            <a th:href="@{/admin}" class="sidebar-link"><i class="bi bi-speedometer2"></i><span>仪表盘</span></a>
            <a th:href="@{/admin/products}" class="sidebar-link active"><i class="bi bi-box-seam"></i><span>商品管理</span></a>
            <a th:href="@{/swagger-ui.html}" class="sidebar-link" target="_blank"><i class="bi bi-braces"></i><span>API 文档</span></a>
        </nav>
    </aside>

    <main class="admin-main">
        <div class="admin-topbar">
            <h1 class="admin-page-title">商品管理</h1>
            <button class="btn btn-accent" data-bs-toggle="modal" data-bs-target="#productModal">
                <i class="bi bi-plus-lg me-1"></i>新增商品
            </button>
        </div>

        <div class="admin-content">
            <div class="data-table-wrap">
                <table class="table admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>商品名称</th>
                            <th>分类</th>
                            <th>价格</th>
                            <th>库存</th>
                            <th>状态</th>
                            <th>创建时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="product : ${productPage.records}">
                            <td th:text="${product.id}">1</td>
                            <td>
                                <div class="table-product-name">
                                    <img th:src="${product.imageUrl} ?: '/images/placeholder.svg'"
                                         class="table-product-img" th:alt="${product.name}"/>
                                    <span th:text="${product.name}">名称</span>
                                </div>
                            </td>
                            <td th:text="${product.category != null} ? ${product.category.name} : '未分类'">分类</td>
                            <td th:text="'¥' + ${#numbers.formatDecimal(product.price,1,2)}">¥0.00</td>
                            <td th:text="${product.stock}">0</td>
                            <td>
                                <span class="status-badge"
                                      th:classappend="${product.status.name() == 'ACTIVE'} ? 'badge-active' : 'badge-inactive'"
                                      th:text="${product.status.name() == 'ACTIVE'} ? '上架' : '下架'">状态</span>
                            </td>
                            <td th:text="${#temporals.format(product.createdAt, 'yyyy-MM-dd')}">日期</td>
                            <td>
                                <button class="btn btn-sm btn-icon"
                                        th:onclick="'editProduct(' + ${product.id} + ')'"
                                        title="编辑"><i class="bi bi-pencil"></i></button>
                                <button class="btn btn-sm btn-icon btn-danger-icon"
                                        th:onclick="'deleteProduct(' + ${product.id} + ')'"
                                        title="删除"><i class="bi bi-trash"></i></button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <nav th:if="${productPage.pages > 1}" class="pagination-wrap">
                <ul class="pagination">
                    <li class="page-item" th:classappend="${productPage.current == 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/products(page=${productPage.current - 1})}"><i class="bi bi-chevron-left"></i></a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(1, productPage.pages)}"
                        th:classappend="${i == productPage.current} ? 'active'">
                        <a class="page-link" th:href="@{/admin/products(page=${i})}" th:text="${i}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${productPage.current == productPage.pages} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/products(page=${productPage.current + 1})}"><i class="bi bi-chevron-right"></i></a>
                    </li>
                </ul>
            </nav>
        </div>
    </main>
</div>

<!-- Product Modal -->
<div class="modal fade" id="productModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content admin-modal">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">新增商品</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="productForm">
                    <input type="hidden" id="productId"/>
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label">商品名称 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="pName" required/>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">SKU</label>
                            <input type="text" class="form-control" id="pSku"/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">价格 <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text">¥</span>
                                <input type="number" class="form-control" id="pPrice" step="0.01" min="0.01" required/>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">库存</label>
                            <input type="number" class="form-control" id="pStock" min="0" value="0"/>
                        </div>
                        <div class="col-12">
                            <label class="form-label">图片URL</label>
                            <input type="url" class="form-control" id="pImageUrl"/>
                        </div>
                        <div class="col-12">
                            <label class="form-label">商品描述</label>
                            <textarea class="form-control" id="pDescription" rows="3"></textarea>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-accent" id="saveProductBtn">保存</button>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/navbar :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
