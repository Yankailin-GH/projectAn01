<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --success: #10b981;
            --danger: #ef4444;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .admin-container {
            width: 100%;
            max-width: 1200px;
        }
        
        .admin-header {
            text-align: center;
            color: white;
            margin-bottom: 3rem;
        }
        
        .admin-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .admin-header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }
        
        .module-card {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }
        
        .module-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }
        
        .module-card:hover::before {
            left: 100%;
        }
        
        .module-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        
        .module-card.users {
            border-top: 4px solid var(--primary);
        }
        
        .module-card.roles {
            border-top: 4px solid var(--secondary);
        }
        
        .module-card.menus {
            border-top: 4px solid var(--success);
        }
        
        .module-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: inline-block;
        }
        
        .module-card.users .module-icon {
            color: var(--primary);
        }
        
        .module-card.roles .module-icon {
            color: var(--secondary);
        }
        
        .module-card.menus .module-icon {
            color: var(--success);
        }
        
        .module-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 0.5rem;
        }
        
        .module-description {
            color: #6b7280;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
        
        .module-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }
        
        .module-card.users .module-link {
            background: var(--primary);
            color: white;
        }
        
        .module-card.users .module-link:hover {
            background: var(--primary-dark);
            transform: translateX(4px);
        }
        
        .module-card.roles .module-link {
            background: var(--secondary);
            color: white;
        }
        
        .module-card.roles .module-link:hover {
            background: #7c3aed;
            transform: translateX(4px);
        }
        
        .module-card.menus .module-link {
            background: var(--success);
            color: white;
        }
        
        .module-card.menus .module-link:hover {
            background: #059669;
            transform: translateX(4px);
        }
        
        .admin-footer {
            text-align: center;
            color: white;
            margin-top: 3rem;
            opacity: 0.8;
        }
        
        .admin-footer a {
            color: white;
            text-decoration: none;
            font-weight: 600;
        }
        
        .admin-footer a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .admin-header h1 {
                font-size: 2rem;
            }
            
            .modules-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1><i class="bi bi-speedometer2"></i> 管理后台</h1>
            <p>系统管理中心</p>
        </div>

        <div class="modules-grid">
            <!-- 用户管理 -->
            <div class="module-card users">
                <div class="module-icon">
                    <i class="bi bi-people"></i>
                </div>
                <h3 class="module-title">用户管理</h3>
                <p class="module-description">
                    管理系统用户账户，包括创建、编辑、删除用户以及重置密码等操作。
                </p>
                <a href="/admin/users" class="module-link">
                    进入管理 <i class="bi bi-arrow-right"></i>
                </a>
            </div>

            <!-- 角色管理 -->
            <div class="module-card roles">
                <div class="module-icon">
                    <i class="bi bi-shield-check"></i>
                </div>
                <h3 class="module-title">角色管理</h3>
                <p class="module-description">
                    创建和管理系统角色，为不同角色分配相应的菜单和权限。
                </p>
                <a href="/admin/roles" class="module-link">
                    进入管理 <i class="bi bi-arrow-right"></i>
                </a>
            </div>

            <!-- 菜单管理 -->
            <div class="module-card menus">
                <div class="module-icon">
                    <i class="bi bi-list"></i>
                </div>
                <h3 class="module-title">菜单管理</h3>
                <p class="module-description">
                    配置系统菜单和按钮权限，支持树形结构和权限标识管理。
                </p>
                <a href="/admin/menus" class="module-link">
                    进入管理 <i class="bi bi-arrow-right"></i>
                </a>
            </div>
        </div>

        <div class="admin-footer">
            <p>© 2026 ProjectAN 管理系统 | <a href="/">返回首页</a></p>
        </div>
    </div>
</body>
</html>
