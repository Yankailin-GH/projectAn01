<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>商品列表 | ProjectAn01</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link th:href="@{/css/main.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<section class="page-hero">
    <div class="container">
        <h1 class="page-title">商品列表</h1>
        <form th:action="@{/products}" method="get" class="search-form-hero">
            <div class="search-hero-wrap">
                <i class="bi bi-search"></i>
                <input type="search" name="keyword" class="form-control"
                       th:value="${keyword}" placeholder="搜索商品名称或描述..."/>
                <button type="submit" class="btn btn-accent">搜索</button>
            </div>
        </form>
    </div>
</section>

<section class="section-products">
    <div class="container">
        <div class="products-toolbar">
            <p class="result-count">共 <strong th:text="${productPage.total}">0</strong> 件商品</p>
            <div sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/admin/products}" class="btn btn-sm btn-outline-accent">
                    <i class="bi bi-plus-lg me-1"></i>管理商品
                </a>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-sm-6 col-lg-4 col-xl-3" th:each="product : ${productPage.records}">
                <a th:href="@{/products/{id}(id=${product.id})}" class="product-card-link">
                    <div class="product-card">
                        <div class="product-img-wrap">
                            <img th:src="${product.imageUrl} ?: '/images/placeholder.svg'"
                                 th:alt="${product.name}" class="product-img" loading="lazy"/>
                            <div class="product-overlay"><i class="bi bi-eye"></i></div>
                            <span class="product-badge" th:if="${product.stock == 0}">缺货</span>
                        </div>
                        <div class="product-body">
                            <div class="product-category" th:text="${product.category != null} ? ${product.category.name} : '未分类'">分类</div>
                            <h3 class="product-name" th:text="${product.name}">商品名称</h3>
                            <div class="product-footer">
                                <div class="product-price">¥<span th:text="${#numbers.formatDecimal(product.price,1,2)}">0.00</span></div>
                                <div class="product-stock" th:text="'库存: ' + ${product.stock}">库存</div>
                            </div>
                        </div>
                    </div>
                </a>
            </div>
        </div>

        <!-- Empty State -->
        <div class="empty-state-wrap" th:if="${productPage.total == 0}">
            <div class="empty-state">
                <i class="bi bi-search"></i>
                <h3>未找到相关商品</h3>
                <p th:if="${keyword}" th:text="'搜索词: ' + ${keyword}"></p>
                <a th:href="@{/products}" class="btn btn-accent">查看全部</a>
            </div>
        </div>

        <!-- Pagination -->
        <nav th:if="${productPage.pages > 1}" class="pagination-wrap">
            <ul class="pagination">
                <li class="page-item" th:classappend="${productPage.current == 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/products(page=${productPage.current - 1},keyword=${keyword})}">
                        <i class="bi bi-chevron-left"></i>
                    </a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(1, productPage.pages)}"
                    th:classappend="${i == productPage.current} ? 'active'">
                    <a class="page-link" th:href="@{/products(page=${i},keyword=${keyword})}" th:text="${i}">1</a>
                </li>
                <li class="page-item" th:classappend="${productPage.current == productPage.pages} ? 'disabled'">
                    <a class="page-link" th:href="@{/products(page=${productPage.current + 1},keyword=${keyword})}">
                        <i class="bi bi-chevron-right"></i>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</section>

<div th:replace="~{fragments/navbar :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
