<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 背景圆形 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ecf0f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <circle cx="100" cy="100" r="100" fill="url(#bgGradient)"/>
  
  <!-- 装饰圆环 -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  
  <!-- 字母 A -->
  <g transform="translate(45, 50)">
    <!-- A 的左斜线 -->
    <line x1="15" y1="80" x2="0" y2="0" stroke="url(#textGradient)" stroke-width="8" stroke-linecap="round"/>
    <!-- A 的右斜线 -->
    <line x1="15" y1="80" x2="30" y2="0" stroke="url(#textGradient)" stroke-width="8" stroke-linecap="round"/>
    <!-- A 的横线 -->
    <line x1="5" y1="50" x2="25" y2="50" stroke="url(#textGradient)" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- 字母 N -->
  <g transform="translate(110, 50)">
    <!-- N 的左竖线 -->
    <line x1="0" y1="80" x2="0" y2="0" stroke="url(#textGradient)" stroke-width="8" stroke-linecap="round"/>
    <!-- N 的斜线 -->
    <line x1="0" y1="80" x2="30" y2="0" stroke="url(#textGradient)" stroke-width="8" stroke-linecap="round"/>
    <!-- N 的右竖线 -->
    <line x1="30" y1="80" x2="30" y2="0" stroke="url(#textGradient)" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- 底部装饰点 -->
  <circle cx="100" cy="165" r="4" fill="#ffffff" opacity="0.6"/>
  <circle cx="85" cy="170" r="3" fill="#ffffff" opacity="0.4"/>
  <circle cx="115" cy="170" r="3" fill="#ffffff" opacity="0.4"/>
</svg>

