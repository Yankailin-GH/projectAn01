<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>登录 | ProjectAn01</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <link rel="apple-touch-icon" th:href="@{/images/logo.svg}">
    <meta name="theme-color" content="#3498db">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-wrapper {
            text-align: center;
            background: #fff;
            border-radius: 20px;
            padding: 40px 50px;
            box-shadow: 0 10px 40px rgba(0,0,0,.1);
            width: 100%;
            max-width: 420px;
        }

        /* ---- 动物容器 ---- */
        .animals-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .animal {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-direction: column;
            gap: 8px;
        }

        /* 熊 - 棕色 */
        .animal.bear {
            background: #c9956f;
            border-radius: 16px;
        }
        .animal.bear::before {
            content: '';
            position: absolute;
            top: -12px;
            width: 20px;
            height: 20px;
            background: #c9956f;
            border-radius: 50%;
            left: 8px;
        }
        .animal.bear::after {
            content: '';
            position: absolute;
            top: -12px;
            width: 20px;
            height: 20px;
            background: #c9956f;
            border-radius: 50%;
            right: 8px;
        }

        /* 猫 - 橙色 */
        .animal.cat {
            background: #ff9f43;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 85%, 0 100%);
        }
        .animal.cat::before {
            content: '';
            position: absolute;
            top: -15px;
            left: 10px;
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 0 solid transparent;
            border-bottom: 18px solid #ff9f43;
        }
        .animal.cat::after {
            content: '';
            position: absolute;
            top: -15px;
            right: 10px;
            width: 0;
            height: 0;
            border-right: 10px solid transparent;
            border-left: 0 solid transparent;
            border-bottom: 18px solid #ff9f43;
        }

        /* 青蛙 - 绿色 */
        .animal.frog {
            background: #1abc9c;
            border-radius: 14px;
        }
        .animal.frog::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 8px;
            width: 16px;
            height: 16px;
            background: #1abc9c;
            border-radius: 50%;
        }
        .animal.frog::after {
            content: '';
            position: absolute;
            top: -10px;
            right: 8px;
            width: 16px;
            height: 16px;
            background: #1abc9c;
            border-radius: 50%;
        }

        /* ---- 眼睛 ---- */
        .eyes-wrapper {
            display: flex;
            gap: 12px;
            justify-content: center;
            z-index: 2;
            position: relative;
        }

        .eye {
            width: 24px;
            height: 24px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .pupil {
            width: 10px;
            height: 10px;
            background: #333;
            border-radius: 50%;
            transition: transform 0.05s ease;
        }

        /* 闭眼状态 */
        .eyes-closed .pupil {
            width: 10px;
            height: 2px;
            background: #333;
            border-radius: 1px;
        }

        /* ---- 鼻子/嘴 ---- */
        .nose {
            width: 8px;
            height: 8px;
            background: #333;
            border-radius: 50%;
            position: relative;
            z-index: 2;
        }

        .mouth {
            width: 20px;
            height: 10px;
            border: 2px solid #fff;
            border-top: none;
            border-radius: 0 0 20px 20px;
            position: relative;
            z-index: 2;
        }

        /* ---- 登录框 ---- */
        .login-card h2 {
            font-size: 28px;
            color: #333;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: #666;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s, box-shadow 0.3s;
            font-family: inherit;
        }

        .input-group input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        .input-group input::placeholder {
            color: #bbb;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #3498db;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            margin-top: 8px;
        }

        .login-btn:hover { background: #2980b9; }
        .login-btn:active { transform: scale(0.98); }

        .extra-links {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
        }

        .extra-links a {
            color: #3498db;
            text-decoration: none;
        }

        .extra-links a:hover { text-decoration: underline; }

        .alert {
            margin-bottom: 15px;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
        }

        .alert-danger {
            background: #ffe5e5;
            color: #c0392b;
            border: 1px solid #e74c3c;
        }

        .alert-success {
            background: #e5ffe5;
            color: #27ae60;
            border: 1px solid #2ecc71;
        }

        .divider {
            margin: 20px 0 15px;
            font-size: 12px;
            color: #999;
        }

        .demo-btn {
            width: 100%;
            padding: 10px;
            background: #ecf0f1;
            border: 1px solid #bdc3c7;
            border-radius: 8px;
            color: #666;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .demo-btn:hover {
            background: #d5dbdb;
            color: #333;
        }

        @media (max-width: 480px) {
            .login-wrapper {
                padding: 30px 20px;
            }
            .animals-container {
                gap: 15px;
            }
            .animal {
                width: 70px;
                height: 70px;
            }
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <!-- 方块动物们 -->
    <div class="animals-container">
        <!-- 熊 -->
        <div class="animal bear">
            <div class="eyes-wrapper">
                <div class="eye"><div class="pupil"></div></div>
                <div class="eye"><div class="pupil"></div></div>
            </div>
            <div class="nose"></div>
        </div>
        <!-- 猫 -->
        <div class="animal cat">
            <div class="eyes-wrapper">
                <div class="eye"><div class="pupil"></div></div>
                <div class="eye"><div class="pupil"></div></div>
            </div>
            <div class="nose"></div>
        </div>
        <!-- 青蛙 -->
        <div class="animal frog">
            <div class="eyes-wrapper">
                <div class="eye"><div class="pupil"></div></div>
                <div class="eye"><div class="pupil"></div></div>
            </div>
            <div class="mouth"></div>
        </div>
    </div>

    <!-- 登录框 -->
    <div class="login-card">
        <h2>欢迎回来</h2>

        <!-- 错误/成功提示 -->
        <div class="alert alert-danger" th:if="${param.error}"><i class="bi bi-exclamation-circle me-2"></i>用户名或密码错误</div>
        <div class="alert alert-success" th:if="${param.logout}"><i class="bi bi-check-circle me-2"></i>已成功退出登录</div>
        <div class="alert alert-success" th:if="${param.registered}"><i class="bi bi-check-circle me-2"></i>注册成功，请登录</div>

        <form th:action="@{/auth/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/>
            <div class="input-group">
                <label for="username">账号</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名" required autofocus>
            </div>
            <div class="input-group">
                <label for="password">密码</label>
                <div style="position: relative;">
                    <input type="password" id="password" name="password" placeholder="请输入密码" required>
                    <button type="button" class="pwd-toggle" id="togglePwd" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #999; cursor: pointer; padding: 0; font-size: 16px;">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="login-btn">登 录</button>
            <div class="extra-links">
                <a href="#" onclick="alert('请联系管理员重置密码'); return false;">忘记密码？</a>
                <a th:href="@{/auth/register}">注册账号</a>
            </div>
        </form>

        <div class="divider">快速体验</div>
        <button type="button" class="demo-btn" onclick="fillDemo('admin','Admin@123')">
            <i class="bi bi-person-badge me-1"></i> 管理员账号
        </button>
    </div>
</div>

<script>
// =============================================
// 眼睛跟随鼠标
// =============================================
document.addEventListener('mousemove', (e) => {
    const eyes = document.querySelectorAll('.eye');
    const pwdInput = document.getElementById('password');
    
    // 密码框有焦点时闭眼
    const isFocused = document.activeElement === pwdInput;
    
    eyes.forEach(eye => {
        const eyesWrapper = eye.parentElement;
        const animal = eyesWrapper.closest('.animal');
        
        if (isFocused) {
            animal.classList.add('eyes-closed');
            return;
        } else {
            animal.classList.remove('eyes-closed');
        }

        const rect = eye.getBoundingClientRect();
        const eyeCenterX = rect.left + rect.width / 2;
        const eyeCenterY = rect.top + rect.height / 2;

        const angle = Math.atan2(e.clientY - eyeCenterY, e.clientX - eyeCenterX);
        const distance = 6;

        const pupilX = Math.cos(angle) * distance;
        const pupilY = Math.sin(angle) * distance;

        const pupil = eye.querySelector('.pupil');
        pupil.style.transform = `translate(${pupilX}px, ${pupilY}px)`;
    });
});

// 密码框事件
const pwdInput = document.getElementById('password');
pwdInput.addEventListener('focus', () => {
    document.querySelectorAll('.animal').forEach(a => a.classList.add('eyes-closed'));
});
pwdInput.addEventListener('blur', () => {
    document.querySelectorAll('.animal').forEach(a => a.classList.remove('eyes-closed'));
});

// 密码显示/隐藏
const togglePwd = document.getElementById('togglePwd');
const pwdField = document.getElementById('password');
togglePwd.addEventListener('click', (e) => {
    e.preventDefault();
    const isPassword = pwdField.type === 'password';
    pwdField.type = isPassword ? 'text' : 'password';
    togglePwd.innerHTML = isPassword ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
});

// 快速填充
function fillDemo(username, password) {
    document.getElementById('username').value = username;
    document.getElementById('password').value = password;
}

// =============================================
// AJAX 登录 - 存储 token 和菜单权限
// =============================================
document.querySelector('form').addEventListener('submit', function(e) {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const btn = document.querySelector('.login-btn');
    btn.disabled = true;
    btn.textContent = '登录中...';

    fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
    })
    .then(r => r.json())
    .then(data => {
        if (data.code === 0) {
            const d = data.data;
            
            // 检查是否有菜单数据
            if (!d.menus || d.menus.length === 0) {
                console.warn('警告：该用户没有分配任何菜单权限');
            }
            
            // 存储 token 和用户信息
            localStorage.setItem('token', d.accessToken);
            localStorage.setItem('refreshToken', d.refreshToken);
            localStorage.setItem('userId', d.userId);
            localStorage.setItem('username', d.username);
            localStorage.setItem('roles', JSON.stringify(d.roles || []));
            // 存储菜单权限
            localStorage.setItem('menus', JSON.stringify(d.menus || []));
            
            console.log('登录成功，用户:', d.username, '菜单数:', d.menus ? d.menus.length : 0);
            
            // 跳转到仪表板
            window.location.href = '/dashboard';
        } else {
            btn.disabled = false;
            btn.textContent = '登 录';
            alert(data.msg || '登录失败，请检查用户名和密码');
        }
    })
    .catch(err => {
        console.error('登录失败:', err);
        btn.disabled = false;
        btn.textContent = '登 录';
        alert('网络错误，请稍后重试');
    });
});
</script>

</body>
</html>
