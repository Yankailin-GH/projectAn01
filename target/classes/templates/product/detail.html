<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${product.name} + ' | ProjectAn01'">商品详情</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link th:href="@{/css/main.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<section class="product-detail-section">
    <div class="container">
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/}">首页</a></li>
                <li class="breadcrumb-item"><a th:href="@{/products}">商品</a></li>
                <li class="breadcrumb-item active" th:text="${product.name}">商品名称</li>
            </ol>
        </nav>
        <div class="row g-5">
            <div class="col-lg-5">
                <div class="product-detail-img-wrap">
                    <img th:src="${product.imageUrl} ?: '/images/placeholder.svg'"
                         th:alt="${product.name}" class="product-detail-img"/>
                </div>
            </div>
            <div class="col-lg-7">
                <div class="product-detail-body">
                    <div class="product-category mb-2" th:text="${product.category != null} ? ${product.category.name} : '未分类'">分类</div>
                    <h1 class="product-detail-title" th:text="${product.name}">商品名称</h1>
                    <div class="product-detail-price">¥<span th:text="${#numbers.formatDecimal(product.price,1,2)}">0.00</span></div>
                    <div class="product-detail-meta">
                        <span class="meta-item"><i class="bi bi-box-seam"></i> SKU: <span th:text="${product.sku} ?: 'N/A'">SKU</span></span>
                        <span class="meta-item" th:classappend="${product.stock == 0} ? 'text-danger' : 'text-success'">
                            <i class="bi bi-check-circle"></i>
                            库存: <span th:text="${product.stock == 0} ? '缺货' : product.stock + ' 件'">库存</span>
                        </span>
                    </div>
                    <p class="product-detail-desc" th:text="${product.description} ?: '暂无描述'">描述</p>
                    <div class="product-detail-actions">
                        <a th:href="@{/products}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-2"></i>返回列表
                        </a>
                        <div sec:authorize="hasRole('ADMIN')">
                            <a th:href="@{/admin/products}" class="btn btn-accent">
                                <i class="bi bi-pencil me-2"></i>编辑商品
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<div th:replace="~{fragments/navbar :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
