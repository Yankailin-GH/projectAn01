<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>个人信息 | ProjectAN</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
    <style>
        body { background: #f5f7fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding-top: 2rem; }
        .content-wrapper { padding: 0 2rem 2rem; max-width: 800px; margin: 0 auto; }
        .back-btn { display: inline-flex; align-items: center; gap: 0.5rem; color: #6366f1; text-decoration: none; font-weight: 500; font-size: 0.9rem; margin-bottom: 1.5rem; }
        .back-btn:hover { color: #4f46e5; }
        .page-title { font-size: 1.5rem; font-weight: 700; color: #1f2937; margin-bottom: 2rem; }
        .card { border: none; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow: hidden; }
        .card-header { background: linear-gradient(135deg, #6366f1, #4f46e5); padding: 2rem; border: none; }
        .avatar-circle { width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 700; color: white; border: 3px solid rgba(255,255,255,0.4); margin-bottom: 1rem; }
        .user-display-name { color: white; font-size: 1.4rem; font-weight: 600; margin: 0; }
        .user-display-role { color: rgba(255,255,255,0.75); font-size: 0.9rem; margin: 0; }
        .card-body { padding: 2rem; }
        .info-row { display: flex; align-items: center; padding: 1rem 0; border-bottom: 1px solid #f1f5f9; }
        .info-row:last-child { border-bottom: none; }
        .info-label { width: 120px; color: #64748b; font-size: 0.9rem; font-weight: 500; flex-shrink: 0; }
        .info-value { color: #1f2937; font-weight: 500; flex: 1; }
        .info-icon { width: 36px; height: 36px; border-radius: 8px; background: #f0f4ff; display: flex; align-items: center; justify-content: center; color: #6366f1; margin-right: 1rem; flex-shrink: 0; }
    </style>
</head>
<body>
<div class="content-wrapper">
    <a href="/dashboard" class="back-btn"><i class="bi bi-arrow-left"></i> 返回仪表板</a>
    <h1 class="page-title"><i class="bi bi-person-badge me-2" style="color:#6366f1"></i>个人信息</h1>

    <div class="card">
        <div class="card-header">
            <div class="avatar-circle" id="profileAvatar">A</div>
            <p class="user-display-name" id="profileName">用户</p>
            <p class="user-display-role" id="profileRole">普通用户</p>
        </div>
        <div class="card-body">
            <div class="info-row">
                <div class="info-icon"><i class="bi bi-person"></i></div>
                <div class="info-label">用户名</div>
                <div class="info-value" id="infoUsername">—</div>
            </div>
            <div class="info-row">
                <div class="info-icon"><i class="bi bi-shield"></i></div>
                <div class="info-label">角色</div>
                <div class="info-value" id="infoRoles">—</div>
            </div>
            <div class="info-row">
                <div class="info-icon"><i class="bi bi-hash"></i></div>
                <div class="info-label">用户ID</div>
                <div class="info-value" id="infoUserId">—</div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const username = localStorage.getItem('username') || '用户';
    const roles = JSON.parse(localStorage.getItem('roles') || '[]');
    const userId = localStorage.getItem('userId') || '—';
    const isAdmin = roles.some(r => r === 'ROLE_ADMIN');

    document.getElementById('profileAvatar').textContent = username.charAt(0).toUpperCase();
    document.getElementById('profileName').textContent = username;
    document.getElementById('profileRole').textContent = isAdmin ? '系统管理员' : '普通用户';
    document.getElementById('infoUsername').textContent = username;
    document.getElementById('infoUserId').textContent = userId;
    document.getElementById('infoRoles').innerHTML = roles.map(r =>
        `<span class="badge bg-primary me-1">${r.replace('ROLE_', '')}</span>`
    ).join('');
</script>
</body>
</html>
