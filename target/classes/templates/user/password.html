<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>修改密码 | ProjectAN</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
    <style>
        body { background: #f5f7fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding-top: 2rem; }
        .content-wrapper { padding: 0 2rem 2rem; max-width: 540px; margin: 0 auto; }
        .back-btn { display: inline-flex; align-items: center; gap: 0.5rem; color: #6366f1; text-decoration: none; font-weight: 500; font-size: 0.9rem; margin-bottom: 1.5rem; }
        .back-btn:hover { color: #4f46e5; }
        .page-title { font-size: 1.5rem; font-weight: 700; color: #1f2937; margin-bottom: 2rem; }
        .card { border: none; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .card-header { background: linear-gradient(135deg, #6366f1, #4f46e5); color: white; border-radius: 16px 16px 0 0 !important; padding: 1.5rem; border: none; }
        .card-body { padding: 2rem; }
        .form-label { font-weight: 500; color: #374151; font-size: 0.9rem; }
        .form-control { border-radius: 8px; border: 1px solid #e2e8f0; padding: 0.75rem 1rem; font-size: 0.95rem; transition: all 0.2s; }
        .form-control:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.12); }
        .btn-submit { width: 100%; padding: 0.85rem; background: linear-gradient(135deg, #6366f1, #4f46e5); border: none; border-radius: 8px; color: white; font-weight: 600; font-size: 1rem; cursor: pointer; transition: all 0.2s; margin-top: 0.5rem; }
        .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(99,102,241,0.4); }
        .alert { border-radius: 8px; font-size: 0.9rem; }
        .input-group-text { background: #f8fafc; border-color: #e2e8f0; cursor: pointer; }
        .strength-bar { height: 4px; border-radius: 2px; margin-top: 6px; transition: all 0.3s; }
    </style>
</head>
<body>
<div class="content-wrapper">
    <a href="/dashboard" class="back-btn"><i class="bi bi-arrow-left"></i> 返回仪表板</a>
    <h1 class="page-title"><i class="bi bi-lock me-2" style="color:#6366f1"></i>修改密码</h1>

    <div class="card">
        <div class="card-header">
            <h5 class="mb-1"><i class="bi bi-shield-lock me-2"></i>安全设置</h5>
            <small style="opacity:.8">请设置一个强密码以保护你的账户安全</small>
        </div>
        <div class="card-body">
            <div id="alertBox" class="alert d-none"></div>
            <form id="passwordForm">
                <div class="mb-3">
                    <label class="form-label">当前密码</label>
                    <div class="input-group">
                        <input type="password" id="oldPassword" class="form-control" placeholder="输入当前密码" required/>
                        <span class="input-group-text" onclick="togglePwd('oldPassword', this)"><i class="bi bi-eye"></i></span>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">新密码</label>
                    <div class="input-group">
                        <input type="password" id="newPassword" class="form-control" placeholder="输入新密码（至少8位）" required oninput="checkStrength(this.value)"/>
                        <span class="input-group-text" onclick="togglePwd('newPassword', this)"><i class="bi bi-eye"></i></span>
                    </div>
                    <div class="strength-bar" id="strengthBar" style="background:#e2e8f0; width:0%"></div>
                    <small id="strengthText" class="text-muted"></small>
                </div>
                <div class="mb-4">
                    <label class="form-label">确认新密码</label>
                    <div class="input-group">
                        <input type="password" id="confirmPassword" class="form-control" placeholder="再次输入新密码" required/>
                        <span class="input-group-text" onclick="togglePwd('confirmPassword', this)"><i class="bi bi-eye"></i></span>
                    </div>
                </div>
                <button type="submit" class="btn-submit">修改密码</button>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function togglePwd(id, btn) {
        const input = document.getElementById(id);
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'bi bi-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'bi bi-eye';
        }
    }

    function checkStrength(pwd) {
        const bar = document.getElementById('strengthBar');
        const text = document.getElementById('strengthText');
        let score = 0;
        if (pwd.length >= 8) score++;
        if (/[A-Z]/.test(pwd)) score++;
        if (/[0-9]/.test(pwd)) score++;
        if (/[^A-Za-z0-9]/.test(pwd)) score++;
        const levels = [
            { w: '0%',   color: '#e2e8f0', label: '' },
            { w: '25%',  color: '#ef4444', label: '弱' },
            { w: '50%',  color: '#f59e0b', label: '一般' },
            { w: '75%',  color: '#3b82f6', label: '较强' },
            { w: '100%', color: '#10b981', label: '强' },
        ];
        const level = levels[score];
        bar.style.width = level.w;
        bar.style.background = level.color;
        text.textContent = level.label ? `密码强度：${level.label}` : '';
        text.style.color = level.color;
    }

    document.getElementById('passwordForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const oldPwd = document.getElementById('oldPassword').value;
        const newPwd = document.getElementById('newPassword').value;
        const confirmPwd = document.getElementById('confirmPassword').value;
        const alertBox = document.getElementById('alertBox');

        if (newPwd !== confirmPwd) {
            alertBox.className = 'alert alert-danger';
            alertBox.textContent = '两次输入的新密码不一致';
            return;
        }
        if (newPwd.length < 8) {
            alertBox.className = 'alert alert-danger';
            alertBox.textContent = '新密码至少需要8位';
            return;
        }

        const token = localStorage.getItem('token');
        try {
            const res = await fetch('/api/users/change-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ oldPassword: oldPwd, newPassword: newPwd })
            });
            const data = await res.json();
            if (data.code === 0) {
                alertBox.className = 'alert alert-success';
                alertBox.textContent = '密码修改成功！即将跳转到登录页...';
                setTimeout(() => {
                    localStorage.clear();
                    window.location.href = '/auth/login';
                }, 2000);
            } else {
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = data.msg || '修改失败，请检查当前密码是否正确';
            }
        } catch (err) {
            alertBox.className = 'alert alert-danger';
            alertBox.textContent = '网络错误，请稍后重试';
        }
    });
</script>
</body>
</html>
